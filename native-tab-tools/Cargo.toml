[package]
name = "loopstudio-tab-tools"
version = "0.8.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-22", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
