[package]
name = "loopstudio"
version = "0.8.0"
description = "Local music practice studio"
edition = "2021"

[features]
python-tab-tools = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-22", "load-dynamic"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
dunce = "1"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
