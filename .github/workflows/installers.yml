name: Build installers
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      NO_STRIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            native-analysis -> ../src-tauri/target
            native-tab-tools -> ../src-tauri/target
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgl1 libfuse2t64 libasound2t64
      - run: npm ci
      - name: Build native workers
        run: |
          cargo build --manifest-path native-analysis/Cargo.toml --release --locked
          cargo build --manifest-path native-tab-tools/Cargo.toml --release --locked
      - name: Stage light runtime and test original OCR
        run: python scripts/prepare-installer.py
      - name: Build light packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run tauri build -- --verbose --config .installer/tauri-light.json --features python-tab-tools -- --locked
          mkdir -p installers/light
          cp src-tauri/target/release/bundle/deb/*.deb installers/light/
          cp src-tauri/target/release/bundle/appimage/*.AppImage installers/light/
      - name: Add standard models
        run: python scripts/prepare-installer.py --models
      - name: Build offline packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run tauri build -- --verbose --config .installer/tauri-offline.json --features python-tab-tools -- --locked
          mkdir -p installers/offline
          cp src-tauri/target/release/bundle/deb/*.deb installers/offline/
          cp src-tauri/target/release/bundle/appimage/*.AppImage installers/offline/
      - name: Package checksums
        run: find installers -type f -exec sha256sum '{}' \; > installers/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoopStudio-Linux-x64-installers
          path: installers/
          compression-level: 0
          retention-days: 30
