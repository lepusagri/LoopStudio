name: Build installers
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      NO_STRIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            native-analysis -> ../src-tauri/target
            native-tab-tools -> ../src-tauri/target
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgl1 libfuse2t64 libasound2t64 ocl-icd-libopencl1
      - run: npm ci
      - name: Debian managed runtime dependencies
        run: sudo apt-get install -y --no-install-recommends python3-numpy python3-pil python3-opencv python3-yaml python3-shapely python3-pyclipper python3-packaging python3-networkx python3-jinja2 python3-filelock python3-fsspec python3-requests python3-charset-normalizer python3-tqdm python3-typing-extensions ffmpeg
      - name: Verify default PDF-to-GP5 backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked standard_build_uses_pdf_to_gp5_backend
      - name: Build native workers
        run: |
          cargo build --manifest-path native-analysis/Cargo.toml --release --locked
          cargo build --manifest-path native-tab-tools/Cargo.toml --release --locked
      - name: Stage light runtime and test original OCR
        run: python scripts/prepare-installer.py
      - name: Build portable light AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export LD_LIBRARY_PATH="$(find "$PWD/.installer/resources" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd:):${LD_LIBRARY_PATH:-}"
          npm run tauri build -- --verbose --bundles appimage --config .installer/tauri-light.json --features python-tab-tools -- --locked
          mkdir -p installers/light
          cp src-tauri/target/release/bundle/appimage/*.AppImage installers/light/
      - name: Build light DEB with apt dependencies
        run: |
          python scripts/prepare-debian.py
          npm run tauri build -- --config .installer/debian/tauri-deb-light.json --features python-tab-tools -- --locked
          cp src-tauri/target/release/bundle/deb/*.deb installers/light/
      - name: Verify installed light DEB
        run: |
          sudo apt-get install -y ./installers/light/*.deb
          /usr/lib/LoopStudio/LoopStudio-tools-runtime/bin/python3 tooling/tab_worker.py --engine pdf --source native-tab-tools/tests/fixtures/tab.png --runtime /usr/lib/LoopStudio/LoopStudio-tools-runtime --output .installer/debian/installed-light-smoke
      - name: Add standard models
        run: python scripts/prepare-installer.py --models
      - name: Build portable offline AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export LD_LIBRARY_PATH="$(find "$PWD/.installer/resources" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd:):${LD_LIBRARY_PATH:-}"
          npm run tauri build -- --verbose --bundles appimage --config .installer/tauri-offline.json --features python-tab-tools -- --locked
          mkdir -p installers/offline
          cp src-tauri/target/release/bundle/appimage/*.AppImage installers/offline/
      - name: Build offline DEB with apt dependencies
        run: |
          python scripts/prepare-debian.py --models
          npm run tauri build -- --config .installer/debian/tauri-deb-offline.json --features python-tab-tools -- --locked
          cp src-tauri/target/release/bundle/deb/*.deb installers/offline/
      - name: Verify installed offline DEB and models
        run: |
          sudo apt-get install -y --reinstall ./installers/offline/*.deb
          /usr/lib/LoopStudio/LoopStudio-tools-runtime/bin/python3 -c "import torch, torchvision, timm, rapidocr_onnxruntime, pdfplumber, guitarpro; print('Installed OCR/OMR imports verified')"
          test -f /usr/lib/LoopStudio/LoopStudio-runtime/models/htdemucs_6s.onnx
          test -f /usr/lib/LoopStudio/LoopStudio-tools-runtime/omr/model/best.pt
          cp .installer/debian/report-*.json installers/
      - name: Package checksums
        run: find installers -type f ! -name SHA256SUMS.txt -exec sha256sum '{}' \; > installers/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoopStudio-Linux-x64-installers
          path: installers/
          compression-level: 0
          retention-days: 30
